name: Run Refresh Token Migration

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Run the refresh token database migration'
        required: true
        default: true
        type: boolean

env:
  DROPLET_IP: ${{ secrets.DIGITALOCEAN_HOST }}
  DROPLET_USER: root
  SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

jobs:
  run-refresh-token-migration:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        echo "🔧 Setting up SSH..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $DROPLET_IP >> ~/.ssh/known_hosts
        echo "SSH setup complete"
        
    - name: Copy refresh token migration script to droplet
      run: |
        echo "📤 Copying refresh token migration script to droplet..."
        echo "🔍 Current directory: $(pwd)"
        echo "🔍 Listing files in current directory:"
        ls -la
        echo "🔍 Checking if migration script exists:"
        if [ -f "migrate_refresh_tokens.py" ]; then
          echo "✅ migrate_refresh_tokens.py exists"
          echo "📄 File size: $(wc -c < migrate_refresh_tokens.py) bytes"
        else
          echo "❌ migrate_refresh_tokens.py does not exist"
          exit 1
        fi
        scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no migrate_refresh_tokens.py $DROPLET_USER@$DROPLET_IP:/tmp/
        
    - name: Run refresh token migration
      run: |
        echo "🔧 Running refresh token migration..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $DROPLET_USER@$DROPLET_IP << 'EOF'
          echo "🔍 Setting up environment..."
          export DATABASE_URL="postgresql://fastapi:password@64.227.134.87:5432/briefings_feed"
          
          echo "🔍 Installing required packages..."
          pip3 install sqlalchemy psycopg2-binary python-dotenv
          
          echo "🔍 Running refresh token migration script..."
          cd /tmp
          python3 migrate_refresh_tokens.py
          
          echo "✅ Refresh token migration completed!"
        EOF
        
    - name: Clean up migration script
      run: |
        echo "🧹 Cleaning up migration script from droplet..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $DROPLET_USER@$DROPLET_IP "rm -f /tmp/migrate_refresh_tokens.py"
        
    - name: Verify migration results
      run: |
        echo "✅ Verifying refresh token migration results..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $DROPLET_USER@$DROPLET_IP << 'EOF'
          echo "📊 Checking refresh_tokens table schema..."
          psql "postgresql://fastapi:password@64.227.134.87:5432/briefings_feed" -c "\d refresh_tokens"
          
          echo ""
          echo "📊 Checking refresh_tokens table indexes..."
          psql "postgresql://fastapi:password@64.227.134.87:5432/briefings_feed" -c "SELECT indexname FROM pg_indexes WHERE tablename = 'refresh_tokens';"
          
          echo ""
          echo "📊 Testing refresh token endpoints..."
          echo "Testing health endpoint..."
          curl -s "http://64.227.134.87:30100/health" | jq '.'
          
          echo ""
          echo "Testing auth endpoints (should return 401 without valid token)..."
          curl -s "http://64.227.134.87:30100/auth/refresh-tokens/stats" | jq '.'
        EOF
